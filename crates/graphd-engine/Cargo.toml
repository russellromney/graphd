[package]
name = "graphd-engine"
version = "0.2.0"
edition = "2021"
description = "Graph database engine: query execution, sandboxing, Bolt protocol, and value types for LadybugDB"
license = "MIT"
repository = "https://github.com/russellromney/graphd"
keywords = ["graph", "database", "cypher", "bolt", "neo4j"]
categories = ["database"]

[features]
default = []
bolt = ["dep:bolt-proto-5x", "dep:bytes"]

[dependencies]
lbug = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt"] }
tracing = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
# Bolt protocol (optional, for Neo4j wire protocol support)
bolt-proto-5x = { version = "0.13", optional = true }
bytes = { version = "1.0", optional = true }
time = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
